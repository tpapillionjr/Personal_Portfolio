<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="900" fill="#05030B"/>
  <text x="104" y="126" fill="#F3EDFF" font-family="Syne, Arial, sans-serif" font-size="60" font-weight="700">Breed setup and stat system</text>
  <text x="104" y="176" fill="#BBA9DE" font-family="Space Grotesk, Arial, sans-serif" font-size="24">New game starts with a breed choice, puppy name, and a visible stat loop.</text>
  <rect x="104" y="222" width="544" height="556" rx="28" fill="#100B19" stroke="rgba(190,160,255,0.18)"/>
  <rect x="752" y="222" width="544" height="556" rx="28" fill="#100B19" stroke="rgba(190,160,255,0.18)"/>
  <text x="146" y="288" fill="#A77EFF" font-family="Space Mono, monospace" font-size="24">new game</text>
  <text x="146" y="346" fill="#F7F2FF" font-family="Space Mono, monospace" font-size="27">A : Shiba Inu</text>
  <text x="146" y="390" fill="#F7F2FF" font-family="Space Mono, monospace" font-size="27">B : Husky</text>
  <text x="146" y="446" fill="#A77EFF" font-family="Space Mono, monospace" font-size="27">&gt; A</text>
  <text x="146" y="498" fill="#CABAE8" font-family="Space Mono, monospace" font-size="23">What do you want to name your Shiba?</text>
  <text x="146" y="548" fill="#F7F2FF" font-family="Space Mono, monospace" font-size="29">Name: Mochi</text>
  <rect x="146" y="604" width="460" height="114" rx="18" fill="#171126"/>
  <text x="176" y="650" fill="#F4EEFF" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="700">Breed behavior</text>
  <text x="176" y="686" fill="#BBA9DE" font-family="Space Grotesk, Arial, sans-serif" font-size="20">Each breed shares the same loop but reacts</text>
  <text x="176" y="714" fill="#BBA9DE" font-family="Space Grotesk, Arial, sans-serif" font-size="20">a little differently to the same actions.</text>
  <text x="794" y="288" fill="#A77EFF" font-family="Space Mono, monospace" font-size="24">tracked stats</text>
  <rect x="794" y="330" width="462" height="80" rx="20" fill="#171126"/>
  <text x="826" y="380" fill="#F3EDFF" font-family="Space Grotesk, Arial, sans-serif" font-size="30">Health</text>
  <rect x="1046" y="352" width="200" height="18" rx="9" fill="#2B233E"/>
  <rect x="1046" y="352" width="158" height="18" rx="9" fill="#A77EFF"/>
  <rect x="794" y="438" width="462" height="80" rx="20" fill="#171126"/>
  <text x="826" y="488" fill="#F3EDFF" font-family="Space Grotesk, Arial, sans-serif" font-size="30">Hunger</text>
  <rect x="1046" y="460" width="200" height="18" rx="9" fill="#2B233E"/>
  <rect x="1046" y="460" width="106" height="18" rx="9" fill="#7C5BFF"/>
  <rect x="794" y="546" width="462" height="80" rx="20" fill="#171126"/>
  <text x="826" y="596" fill="#F3EDFF" font-family="Space Grotesk, Arial, sans-serif" font-size="30">Happiness</text>
  <rect x="1046" y="568" width="200" height="18" rx="9" fill="#2B233E"/>
  <rect x="1046" y="568" width="142" height="18" rx="9" fill="#D66BFF"/>
  <rect x="794" y="654" width="462" height="80" rx="20" fill="#171126"/>
  <text x="826" y="704" fill="#F3EDFF" font-family="Space Grotesk, Arial, sans-serif" font-size="30">Level</text>
  <text x="1128" y="704" fill="#F7F2FF" font-family="Space Mono, monospace" font-size="28">0 / 10</text>
</svg>
